<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RDU flights by Vinny" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiUkRVIGZsaWdodHMgYnkgVmlubnkiLCJzaG9ydF9uYW1lIjoiUkRVIGJ5IFZpbm55Iiwic3RhcnRfdXJsIjoiLiIsInRoZW1lX2NvbG9yIjoiIzBmMTcyYSIsImJhY2tncm91bmRfY29sb3IiOiIjMGYxNzJhIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJvcmllbnRhdGlvbiI6InBvcnRyYWl0IiwiaWNvbnMiOlt7InNyYyI6ImRhdGE6aW1hZ2Uvc3ZnK3htbCwlM0NzdmcgeG1sbnM9J2h0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnJyB2aWV3Qm94PScwIDAgMTAwIDEwMCclM0UlM0NyZWN0IHdpZHRoPScxMDAnIGhlaWdodD0nMTAwJyByeD0nMjAnIGZpbGw9JyUyMzI1NjNlYicvJTNFJTNDdGV4dCB4PSc1MCcgeT0nNjInIGZvbnQtc2l6ZT0nNDAnIHRleHQtYW5jaG9yPSdtaWRkbGUnIGZpbGw9J3doaXRlJyUzRSVFMiU5QyU4OCUzQy90ZXh0JTNFJTNDL3N2ZyUzRSIsInNpemVzIjoiMTkyeDE5MiIsInR5cGUiOiJpbWFnZS9zdmcreG1sIn1dfQ==" />
  <title>RDU flights by Vinny</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --info: #0891b2;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
      --radius: 12px;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #22d3ee;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow);
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      text-decoration: none;
      color: inherit;
    }
    .logo-badge {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      display: block;
      background: transparent;
      line-height: 0;
    }
    .logo-badge img {
      width: 100%;
      height: auto;
      display: block;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      flex-shrink: 0;
      padding-top: 2px;
    }
    button, select, input {
      font: inherit;
      color: var(--text);
    }
    .icon-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s;
      font-size: 1.1rem;
    }
    .icon-btn:hover { background: var(--border); }
    .icon-btn:active { transform: scale(.96); }
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: 10px;
      padding: 3px;
    }
    .tab {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: 600;
      font-size: .9rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all .15s;
    }
    .tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    /* Filter drawer — sticky under header so the tab stays reachable while scrolling */
    .filter-drawer {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: var(--header-h, 160px);
      z-index: 49;
      box-shadow: var(--shadow);
    }
    .filter-drawer-body {
      overflow: hidden;
      max-height: 340px;
      transition: max-height 0.28s ease, opacity 0.2s ease, padding 0.28s ease;
      opacity: 1;
      padding: 0 16px 4px;
    }
    .filter-drawer.collapsed .filter-drawer-body {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      padding-bottom: 8px;
    }
    @media (min-width: 640px) {
      .filters { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 900px) {
      .filters { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1100px) {
      .filters { grid-template-columns: repeat(7, 1fr); }
    }
    .filter-group label {
      display: block;
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    select, input[type="search"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      font-size: .9rem;
    }
    select:focus, input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .drawer-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 8px 16px 10px;
      border: none;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }
    .drawer-handle:hover { color: var(--text); }
    .drawer-handle-bar {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: var(--border);
      flex-shrink: 0;
    }
    .drawer-handle-icon {
      font-size: 0.7rem;
      line-height: 1;
      transition: transform 0.25s ease;
    }
    .filter-drawer.collapsed .drawer-handle-icon {
      transform: rotate(180deg);
    }
    .drawer-handle-label {
      min-width: 5.5em;
      text-align: center;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 10px 16px;
      font-size: .8rem;
      color: var(--text-muted);
      align-items: center;
    }
    .meta-bar .count { font-weight: 600; color: var(--text); }
    .refresh-info { margin-left: auto; }
    main {
      padding: 8px 12px 24px;
      max-width: 900px;
      margin: 0 auto;
    }
    .flight-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px 16px;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .time-col { text-align: left; min-width: 4.5rem; }
    .time-main {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .time-sched {
      font-size: .75rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .time-updated {
      font-size: .65rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .flight-info { min-width: 0; }
    .route {
      font-weight: 600;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .flight-meta {
      font-size: .8rem;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }
    .status-col {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      white-space: nowrap;
    }
    .badge-on-time, .badge-scheduled { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
    .badge-landed, .badge-departed { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
    .badge-delayed { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
    .badge-canceled { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
    .gate {
      font-size: .8rem;
      font-weight: 600;
      color: var(--text);
    }
    .empty, .loading, .error-box {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }
    .loading { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    .error-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 520px;
      margin: 24px auto;
      text-align: left;
    }
    .error-box h2 {
      font-size: 1.1rem;
      color: var(--danger);
      margin-bottom: 8px;
    }
    .error-box p, .error-box li {
      font-size: .9rem;
      margin-bottom: 8px;
      color: var(--text);
    }
    footer {
      text-align: center;
      padding: 16px;
      font-size: .75rem;
      color: var(--text-muted);
    }
    #installBanner {
      display: none;
      background: var(--accent);
      color: white;
      padding: 10px 16px;
      text-align: center;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    #installBanner.show { display: block; }
    @media (max-width: 400px) {
      .flight-card { grid-template-columns: 1fr auto; }
      .time-col { grid-column: 1 / -1; display: flex; gap: 12px; align-items: baseline; text-align: left; }
      .time-updated { margin-top: 0; }
    }
  </style>
</head>
<body>
  <div id="installBanner">📲 Tap here to Add to Home Screen</div>

  <header>
    <div class="header-top">
      <div class="logo" aria-label="RDU by Vinny">
        <div class="logo-badge">
          <img id="logoBadgeImg" src="RDUbyVinny-night.jpg" alt="RDU by Vinny" />
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">↻</button>
        <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-scope="all">All</button>
      <button class="tab" data-scope="departure">Departures</button>
      <button class="tab" data-scope="arrival">Arrivals</button>
    </div>
  </header>

  <div class="filter-drawer" id="filterDrawer">
    <div class="filter-drawer-body">
      <div class="filters">
        <div class="filter-group">
          <label for="dayFilter">Day</label>
          <select id="dayFilter">
            <option value="yesterday">Yesterday</option>
            <option value="today" selected>Today</option>
            <option value="tomorrow">Tomorrow</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="airlineFilter">Airline</label>
          <select id="airlineFilter"><option value="">All airlines</option></select>
        </div>
        <div class="filter-group">
          <label for="terminalFilter">Terminal</label>
          <select id="terminalFilter">
            <option value="">All terminals</option>
            <option value="1">Terminal 1</option>
            <option value="2">Terminal 2</option>
            <option value="unknown">Unknown / Other</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="progressFilter">Progress</label>
          <select id="progressFilter">
            <option value="">All flights</option>
            <option value="upcoming">Pending flights</option>
            <option value="completed">Completed flights</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="sortFilter">Sort by</label>
          <select id="sortFilter">
            <option value="scheduled">Scheduled time</option>
            <option value="best">Updated time</option>
            <option value="updated">Most recently updated</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="searchFilter">Search</label>
          <input type="search" id="searchFilter" placeholder="Flight, city, gate…" />
        </div>
      </div>
    </div>
    <button type="button" class="drawer-handle" id="drawerHandle" aria-expanded="true" aria-controls="filterDrawer">
      <span class="drawer-handle-bar" aria-hidden="true"></span>
      <span class="drawer-handle-icon" aria-hidden="true">▲</span>
      <span class="drawer-handle-label" id="drawerHandleLabel">Hide filters</span>
      <span class="drawer-handle-bar" aria-hidden="true"></span>
    </button>
  </div>

  <div class="meta-bar">
    <span>Showing <span class="count" id="shownCount">0</span> of <span class="count" id="totalCount">0</span></span>
    <span class="refresh-info" id="lastRefresh">—</span>
  </div>

  <main id="list">
    <div class="loading">Loading flights…</div>
  </main>

  <footer>
    RDU flights by Vinny · Data from RDU official API · Auto-refreshes every 60s
  </footer>

  <script>
    const PROXY_URL = 'https://rdu-flights-proxy.n-v-medina-1104.workers.dev';
    const BASE = PROXY_URL.replace(/\/$/, '');

    function deriveTerminal(gate) {
      if (!gate) return 'unknown';
      const g = String(gate).toUpperCase();
      if (g.startsWith('A')) return '1';
      if (g.startsWith('C') || g.startsWith('D') || g.startsWith('B')) return '2';
      return 'unknown';
    }

    function terminalLabel(t) {
      if (t === '1') return 'T1';
      if (t === '2') return 'T2';
      return '—';
    }

    let allFlights = [];
    let scope = 'all';
    let deferredPrompt = null;

    const $ = (sel) => document.querySelector(sel);
    const listEl = $('#list');
    const daySelect = $('#dayFilter');
    const airlineSelect = $('#airlineFilter');
    const terminalSelect = $('#terminalFilter');
    const progressSelect = $('#progressFilter');
    const sortSelect = $('#sortFilter');
    const searchInput = $('#searchFilter');
    const filterDrawer = $('#filterDrawer');
    const drawerHandle = $('#drawerHandle');
    const drawerHandleLabel = $('#drawerHandleLabel');

    // Theme — dark is the default for new visitors
    const themeBtn = $('#themeBtn');
    const logoBadgeImg = $('#logoBadgeImg');
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀' : '☾';
      localStorage.setItem('rdu-theme', theme);
      // Day badge in light mode, night badge in dark mode
      if (logoBadgeImg) {
        logoBadgeImg.src = theme === 'dark' ? 'RDUbyVinny-night.jpg' : 'RDUbyVinny-day.jpg';
      }
    }
    applyTheme(localStorage.getItem('rdu-theme') || 'dark');
    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    });

    // Tabs & filters
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        scope = btn.dataset.scope;
        render();
      });
    });
    [daySelect, airlineSelect, terminalSelect, progressSelect, sortSelect].forEach(el => {
      el.addEventListener('change', render);
    });
    searchInput.addEventListener('input', debounce(render, 200));
    $('#refreshBtn').addEventListener('click', () => fetchFlights(true));

    // Filter drawer open / close
    function updateHeaderOffset() {
      const header = document.querySelector('header');
      if (header) {
        document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
      }
    }
    updateHeaderOffset();
    window.addEventListener('resize', updateHeaderOffset);
    if (logoBadgeImg) {
      logoBadgeImg.addEventListener('load', updateHeaderOffset);
      if (logoBadgeImg.complete) updateHeaderOffset();
    }

    function setDrawerCollapsed(collapsed) {
      filterDrawer.classList.toggle('collapsed', collapsed);
      drawerHandle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      drawerHandleLabel.textContent = collapsed ? 'Show filters' : 'Hide filters';
      localStorage.setItem('rdu-drawer-collapsed', collapsed ? '1' : '0');
      // Header height is stable; keep offset in sync after layout settles
      requestAnimationFrame(updateHeaderOffset);
    }
    const preferCollapsed = localStorage.getItem('rdu-drawer-collapsed');
    setDrawerCollapsed(
      preferCollapsed === null
        ? window.matchMedia('(max-width: 700px)').matches
        : preferCollapsed === '1'
    );
    drawerHandle.addEventListener('click', () => {
      setDrawerCollapsed(!filterDrawer.classList.contains('collapsed'));
    });
    let touchStartY = null;
    drawerHandle.addEventListener('touchstart', (e) => {
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });
    drawerHandle.addEventListener('touchend', (e) => {
      if (touchStartY == null) return;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartY = null;
      if (Math.abs(dy) < 24) return;
      if (dy > 0) setDrawerCollapsed(true);
      else setDrawerCollapsed(false);
    }, { passive: true });

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function formatTime(ts) {
      if (!ts) return '—';
      return new Date(ts * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function formatRelative(ts) {
      if (!ts) return '';
      const diff = Math.round((Date.now() / 1000) - ts);
      if (diff < 60) return 'just now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return formatTime(ts);
    }

    function rduDateString(offsetDays = 0) {
      const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/New_York',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      const d = new Date(Date.now() + offsetDays * 86400000);
      return fmt.format(d);
    }

    function selectedScheduledDate() {
      const day = daySelect.value;
      if (day === 'yesterday') return rduDateString(-1);
      if (day === 'tomorrow') return rduDateString(1);
      return rduDateString(0);
    }

    function statusClass(status, isDelayed) {
      const s = (status || '').toLowerCase();
      if (s === 'canceled' || s === 'cancelled') return 'badge-canceled';
      if (s === 'landed' || s === 'arrived') return 'badge-landed';
      if (s === 'departed') return 'badge-departed';
      if (isDelayed || s === 'delayed') return 'badge-delayed';
      if (s === 'scheduled' || s === 'on time') return 'badge-scheduled';
      return 'badge-on-time';
    }

    function statusLabel(f) {
      if (f.isDelayed && !['Landed', 'Departed', 'Canceled'].includes(f.status)) return 'Delayed';
      return f.status || '—';
    }

    function isCompleted(f) {
      const s = (f.status || '').toLowerCase();
      return s === 'landed' || s === 'departed' || s === 'arrived' || s === 'canceled' || s === 'cancelled';
    }

    async function fetchFlights(manual = false) {
      if (manual) listEl.innerHTML = '<div class="loading">Refreshing…</div>';

      const now = Math.floor(Date.now() / 1000);
      const from = now - 36 * 3600;
      const to = now + 36 * 3600;
      const url = `${BASE}/flights?scheduledTimestamp=${from}..${to}`;

      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (json.status && json.status.code && json.status.code !== 200) {
          throw new Error(json.status.message || 'API error');
        }
        allFlights = (json.data?.flights || [])
          .filter(f => f.isVisible !== false && !f.isDeleted)
          .map(f => ({
            ...f,
            terminal: deriveTerminal(f.gate),
            displayTime: f.bestKnownTimestamp || f.estimatedTimestamp || f.actualTimestamp || f.scheduledTimestamp,
            isArrival: !!f.arrival
          }))
          .sort((a, b) => a.displayTime - b.displayTime);

        populateAirlines();
        $('#lastRefresh').textContent = `Updated ${new Date().toLocaleTimeString()}`;
        render();
      } catch (err) {
        console.error(err);
        const msg = (err && err.message) || String(err);
        listEl.innerHTML = `
          <div class="error-box" style="padding:20px">
            <h2>Could not load flight data</h2>
            <p><strong>Reason:</strong> ${msg}</p>
            <p>Check that your Cloudflare Worker is deployed and reachable.</p>
            <p style="margin-top:12px">
              <button class="icon-btn" style="width:auto;padding:8px 16px" onclick="fetchFlights(true)">Try again</button>
            </p>
          </div>`;
      }
    }

    // Common IATA codes → full airline names (RDU-focused + major carriers)
    const AIRLINE_NAMES = {
      AA: 'American Airlines', AS: 'Alaska Airlines', B6: 'JetBlue',
      DL: 'Delta Air Lines', F9: 'Frontier', G4: 'Allegiant',
      HA: 'Hawaiian Airlines', NK: 'Spirit', SY: 'Sun Country',
      UA: 'United Airlines', WN: 'Southwest', MX: 'Breeze Airways',
      '9E': 'Endeavor (Delta)', MQ: 'Envoy (American)', OH: 'PSA (American)',
      OO: 'SkyWest', QX: 'Horizon', YX: 'Republic',
      PT: 'Piedmont', YV: 'Mesa', CP: 'Compass',
      C5: 'CommutAir', ZW: 'Air Wisconsin', G7: 'GoJet',
      RV: 'Air Canada Rouge', AC: 'Air Canada', BA: 'British Airways',
      LH: 'Lufthansa', AF: 'Air France', KL: 'KLM',
      IB: 'Iberia', EK: 'Emirates', QR: 'Qatar Airways',
      VS: 'Virgin Atlantic', LX: 'SWISS', EI: 'Aer Lingus',
      PD: 'Porter', WS: 'WestJet', TS: 'Air Transat',
      XP: 'Avelo', LF: 'Contour',
      AM: 'Aeroméxico', '2T': 'BermudAir', CM: 'Copa Airlines',
      FL: 'Icelandair', FI: 'Icelandair', Y4: 'Volaris'
    };

    function airlineName(code) {
      if (!code) return '';
      const c = String(code).toUpperCase();
      return AIRLINE_NAMES[c] || c;
    }

    function airlineLabel(code) {
      if (!code) return '';
      const c = String(code).toUpperCase();
      const name = AIRLINE_NAMES[c];
      return name ? `${name} (${c})` : c;
    }

    function populateAirlines() {
      const current = airlineSelect.value;
      const airlines = [...new Set(allFlights.map(f => f.iataOperatingAirline).filter(Boolean))]
        .sort((a, b) => airlineLabel(a).localeCompare(airlineLabel(b)));
      airlineSelect.innerHTML = '<option value="">All airlines</option>' +
        airlines.map(a => `<option value="${a}">${airlineLabel(a)}</option>`).join('');
      airlineSelect.value = current;
    }

    function render() {
      const airline = airlineSelect.value;
      const terminal = terminalSelect.value;
      const progress = progressSelect.value;
      const sortBy = sortSelect.value || 'scheduled';
      const targetDate = selectedScheduledDate();
      const q = searchInput.value.trim().toLowerCase();

      let filtered = allFlights.filter(f => {
        if (f.scheduledDate !== targetDate) return false;
        if (scope === 'departure' && f.isArrival) return false;
        if (scope === 'arrival' && !f.isArrival) return false;
        if (airline && f.iataOperatingAirline !== airline) return false;
        if (terminal && f.terminal !== terminal) return false;
        if (progress === 'upcoming' && isCompleted(f)) return false;
        if (progress === 'completed' && !isCompleted(f)) return false;
        if (q) {
          const hay = [
            f.iataOperatingAirlineFlightNumber,
            f.codeShareFlightNumber,
            f.departureAirport,
            f.arrivalAirport,
            f.gate,
            f.status,
            f.iataOperatingAirline,
            airlineName(f.iataOperatingAirline)
          ].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'updated') {
          return (b.lastUpdatedTimestamp || 0) - (a.lastUpdatedTimestamp || 0);
        }
        if (sortBy === 'best') {
          return (a.displayTime || 0) - (b.displayTime || 0);
        }
        return (a.scheduledTimestamp || 0) - (b.scheduledTimestamp || 0);
      });

      $('#shownCount').textContent = filtered.length;
      $('#totalCount').textContent = allFlights.length;

      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty">No flights match your filters.</div>';
        return;
      }

      listEl.innerHTML = filtered.map(f => {
        const dest = f.isArrival ? f.departureAirport : f.arrivalAirport;
        const sched = f.scheduledTimestamp;
        const best = f.displayTime;
        const showCorrection = best && sched && best !== sched;
        const badgeCls = statusClass(f.status, f.isDelayed);
        const label = statusLabel(f);

        return `
          <article class="flight-card">
            <div class="time-col">
              <div class="time-main">${formatTime(best)}</div>
              ${showCorrection ? `<div class="time-sched">${formatTime(sched)}</div>` : ''}
              <div class="time-updated" title="Last updated">${formatRelative(f.lastUpdatedTimestamp)}</div>
            </div>
            <div class="flight-info">
              <div class="route">${f.isArrival ? '←' : '→'} ${dest || '—'} · ${f.iataOperatingAirlineFlightNumber || f.codeShareFlightNumber || '—'}</div>
              <div class="flight-meta">
                <span>${airlineLabel(f.iataOperatingAirline)}</span>
                <span>${terminalLabel(f.terminal)}${f.gate ? ' · Gate ' + f.gate : ''}</span>
                ${f.isArrival && f.baggageBelt?.length ? `<span>Bag ${f.baggageBelt.join(',')}</span>` : ''}
              </div>
            </div>
            <div class="status-col">
              <span class="badge ${badgeCls}">${label}</span>
              ${f.gate ? `<span class="gate">${f.gate}</span>` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    // PWA install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $('#installBanner').classList.add('show');
    });
    $('#installBanner').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') $('#installBanner').classList.remove('show');
      deferredPrompt = null;
    });

    // Clear any old service workers / caches from later versions
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    }
    if (window.caches) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
    }

    fetchFlights();
    setInterval(() => fetchFlights(false), 60_000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchFlights(false);
    });
  </script>
</body>
</html>
